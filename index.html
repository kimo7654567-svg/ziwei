<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紫微斗數解讀</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 1.5rem; color: #1a1a1a; }
    .upload-area {
      border: 1.5px dashed #ccc;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: #888; }
    .upload-area.has-image { border-style: solid; border-color: #4a90d9; }
    .upload-area p { color: #888; font-size: 14px; }
    #preview { max-width: 100%; border-radius: 8px; margin-top: 1rem; display: none; }
    #fileInput { display: none; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 1rem;
    }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn:hover:not(:disabled) { background: #333; }

    .status-box {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: #f8f8f5;
      border-radius: 10px;
      align-items: center;
      gap: 12px;
    }
    .status-box.visible { display: flex; }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #ddd;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }
    .spinner.done {
      border-color: #4caf50;
      border-top-color: #4caf50;
      animation: none;
    }
    .spinner.error {
      border-color: #e53935;
      border-top-color: #e53935;
      animation: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 13px; color: #555; line-height: 1.5; }
    .status-text .step { color: #1a1a1a; font-weight: 500; }
    .status-text .timer { color: #aaa; font-size: 12px; margin-top: 2px; }

    #result {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: #fafaf8;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.8;
      color: #2a2a2a;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>紫微斗數命盤解讀</h1>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <p id="uploadText">點此上傳命盤圖片</p>
      <img id="preview" />
    </div>
    <input type="file" id="fileInput" accept="image/*" />

    <button class="btn" id="analyzeBtn" disabled onclick="analyze()">開始解讀</button>

    <div class="status-box" id="statusBox">
      <div class="spinner" id="spinner"></div>
      <div class="status-text">
        <div class="step" id="stepText"></div>
        <div class="timer" id="timerText"></div>
      </div>
    </div>

    <div id="result"></div>
  </div>

  <script>
    let base64Image = '';
    let mimeType = '';
    let timerInterval = null;
    let seconds = 0;

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      mimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(ev) {
        base64Image = ev.target.result.split(',')[1];
        const preview = document.getElementById('preview');
        preview.src = ev.target.result;
        preview.style.display = 'block';
        document.getElementById('uploadText').style.display = 'none';
        document.querySelector('.upload-area').classList.add('has-image');
        document.getElementById('analyzeBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    });

    function startTimer() {
      seconds = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        seconds++;
        document.getElementById('timerText').textContent = '已等待 ' + seconds + ' 秒';
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function setStep(text) {
      document.getElementById('stepText').textContent = text;
    }

    function showStatus() {
      document.getElementById('statusBox').classList.add('visible');
    }

    function setDone() {
      stopTimer();
      document.getElementById('spinner').className = 'spinner done';
      document.getElementById('timerText').textContent = '完成，共花費 ' + seconds + ' 秒';
    }

    function setError() {
      stopTimer();
      document.getElementById('spinner').className = 'spinner error';
    }

    function analyze() {
      const btn = document.getElementById('analyzeBtn');
      const result = document.getElementById('result');

      btn.disabled = true;
      result.style.display = 'none';
      document.getElementById('spinner').className = 'spinner';

      showStatus();
      setStep('正在讀取知識庫...');
      startTimer();

      setTimeout(function() {
        setStep('知識庫載入完成，送出命盤圖...');
      }, 1500);

      setTimeout(function() {
        setStep('Gemini 分析中，請稍候...');
      }, 3000);

      google.script.run
        .withSuccessHandler(function(data) {
          if (data.error) {
            setStep('錯誤：' + data.error);
            setError();
          } else {
            setStep('解讀完成');
            setDone();
            result.textContent = data.result;
            result.style.display = 'block';
          }
          btn.disabled = false;
        })
        .withFailureHandler(function(err) {
          setStep('錯誤：' + err.message);
          setError();
          btn.disabled = false;
        })
        .analyze(base64Image, mimeType);
    }
  </script>
</body>
</html>
