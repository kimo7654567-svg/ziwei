<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紫微斗數解讀</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #1a1a1a;
    }
    .upload-area {
      border: 1.5px dashed #ccc;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: #888; }
    .upload-area.has-image { border-style: solid; border-color: #4a90d9; }
    .upload-area p { color: #888; font-size: 14px; }
    #preview { max-width: 100%; border-radius: 8px; margin-top: 1rem; display: none; }
    #fileInput { display: none; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 1rem;
    }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn:hover:not(:disabled) { background: #333; }
    #status {
      font-size: 13px;
      color: #888;
      margin-top: 0.75rem;
      min-height: 20px;
      text-align: center;
    }
    #result {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: #fafaf8;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.8;
      color: #2a2a2a;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>紫微斗數命盤解讀</h1>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <p id="uploadText">點此上傳命盤圖片</p>
      <img id="preview" />
    </div>
    <input type="file" id="fileInput" accept="image/*" />

    <button class="btn" id="analyzeBtn" disabled onclick="analyze()">
      開始解讀
    </button>
    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwKW093Ds3oYMC0BIdV1o5GIOcby-26O5AxQVjP_ivJSQmyOTrpW3q2NsTQt-_pmoRv/exec';

    let base64Image = '';
    let mimeType = '';

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      mimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(ev) {
        base64Image = ev.target.result.split(',')[1];
        const preview = document.getElementById('preview');
        preview.src = ev.target.result;
        preview.style.display = 'block';
        document.getElementById('uploadText').style.display = 'none';
        document.querySelector('.upload-area').classList.add('has-image');
        document.getElementById('analyzeBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    });

    async function analyze() {
      const btn = document.getElementById('analyzeBtn');
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      btn.disabled = true;
      status.textContent = '正在載入知識庫並分析命盤，請稍候...';
      result.style.display = 'none';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image, mimeType: mimeType })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        result.textContent = data.result;
        result.style.display = 'block';
        status.textContent = '解讀完成';
      } catch (err) {
        status.textContent = '錯誤：' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
